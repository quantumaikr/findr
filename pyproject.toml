[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "findr-ai"
version = "0.2.17"
description = "기억나는 대로 물으면, 내 PC가 찾아 줍니다 - 내 PC 안에서만 동작하는 자연어 파일·사진 검색"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "quantumaikr" }]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "torch>=2.4",                 # the installer picks the CUDA / CPU / Apple build
  "torchvision>=0.19",
  # EmbeddingGemma-2 needs a transformers build newer than the last release (5.22.2): pinned to the tested commit
  # the tested commit, pre-built (pure Python): nothing is compiled on the user's PC (#3). Served from the model repository
  # (the same file, sha256 a8b00f7d...): GitHub release downloads answered 504 for hours on 2026-11-08 and stopped installs
  "transformers @ https://huggingface.co/quantumaikr/findr-models/resolve/af56ccb34b94b2348da3216eb3458c12fc8968d5/deps/transformers-5.23.0.dev0-py3-none-any.whl#sha256=a8b00f7db929ea8cc11c7422585f0ea99d72804e14b3978fb3dd3d9fed5a1ef6",
  "sentence-transformers>=5.0",
  "huggingface_hub>=0.30",
  "pypdf>=4.0",
  "pypdfium2>=4.30",            # fast PDF text on Windows and macOS (Chrome's PDF engine)
  "olefile>=0.46",
  "python-calamine>=0.3",       # old Excel (.xls), .xlsb and .ods without LibreOffice (a Rust reader)
  "pillow>=10.0",
  "pillow-heif>=0.18",          # iPhone photos (HEIC)
  "easyocr>=1.7",               # text in scanned PDFs, screenshots and photos (Korean + English)
  "pyobjc-framework-Vision>=10.0; sys_platform == 'darwin'",   # macOS built-in text recognition: faster and better Korean than EasyOCR
  "winrt-Windows.Media.Ocr>=2.0; sys_platform == 'win32'",     # Windows built-in text recognition (with its Korean recognizer)
  "winrt-Windows.Globalization>=2.0; sys_platform == 'win32'",
  "winrt-Windows.Graphics.Imaging>=2.0; sys_platform == 'win32'",
  "winrt-Windows.Storage.Streams>=2.0; sys_platform == 'win32'",
  "winrt-Windows.Foundation>=2.0; sys_platform == 'win32'",
  "truststore>=0.9",            # system certificates (company networks)
  "mcp>=1.2",                   # AI tools on this PC find files through findr (findr mcp)
  "onnxruntime>=1.18",          # the int8 reranker on PCs without a GPU (about 2.7x faster)
  "einops>=0.7",                # the photo model's image processor: without it the photo server stopped at start
  "accelerate>=1.0",
  "psutil>=5.9",                # the resource manager: free memory, CPU load, battery (it came with accelerate; now named)
]

[project.scripts]
findr = "findr.cli:main"

[project.urls]
Homepage = "https://github.com/quantumaikr/findr"
Models = "https://huggingface.co/quantumaikr/findr-models"

[tool.setuptools]
packages = ["findr", "findr.core"]

[tool.setuptools.package-data]
"findr.core" = ["*.html", "doctype_heads.json"]
