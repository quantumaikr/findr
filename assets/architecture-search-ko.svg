<text font-size="11.5" fill="#1d1c1a" x="34" y="508">계획 모델이 조건·관계를 계획 → 사실 카드·연결로 실행 → 교차 인코더 순서</text>
<text font-size="11.5" fill="#6b6862" x="34" y="526">관계 질문에 강함 · 업무 정보 없으면 정밀 경로로</text>
