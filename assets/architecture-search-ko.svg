<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" font-family="-apple-system, Segoe UI, Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif" viewBox="0 0 1120 560" role="img" aria-label="질문이 정리와 경로 선택을 거쳐 네 갈래 후보 수집, 합치기, 다시 순위, 규칙 보정, 판단을 지나 결과와 확률이 되는 흐름"><rect x="0" y="0" width="100%" height="100%" rx="12" fill="#f7f6f2"/>
<defs><marker id="ar3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d1c1a"/></marker></defs>
