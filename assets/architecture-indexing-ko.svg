<text font-size="11.5" fill="#1d1c1a" x="398" y="288">문서 뒷부분 · 남은 쪽 스캔(최대 50쪽) · 사진 글자 · 뒤쪽 조각의 뜻 · 작은 모델 → 큰 모델 전환(다 되면 한 번에)</text>
