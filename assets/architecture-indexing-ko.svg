<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="330" font-family="-apple-system, Segoe UI, Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif" viewBox="0 0 1120 330" role="img" aria-label="색인 다섯 단계가 차례로 끝나며 이름, 이름 뜻, 문서 글자, 뜻, 스캔 글자 검색이 가능해지고, 나머지는 쉬는 시간에 채워지는 흐름"><rect x="0" y="0" width="100%" height="100%" rx="12" fill="#f7f6f2"/>
<defs><marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d1c1a"/></marker></defs>
<rect fill="#ffffff" stroke="#d9d5cc" stroke-width="1.2" x="20" y="40" width="150" height="150" rx="10"/>
