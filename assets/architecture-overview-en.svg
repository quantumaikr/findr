<rect fill="#ffffff" stroke="#d9d5cc" stroke-width="1.2" x="20" y="30" width="250" height="370" rx="12"/>
<text font-size="13.5" font-weight="650" fill="#1d1c1a" x="40" y="58">Desktop app (Tauri)</text>
<text font-size="11.5" fill="#6b6862" x="40" y="78">Windows · macOS · Linux</text>
<text font-size="11.5" fill="#1d1c1a" x="40" y="112">• First run: set up for this PC</text>
<text font-size="11.5" fill="#6b6862" x="52" y="130">GPU check → runtime → models</text>
<text font-size="11.5" fill="#1d1c1a" x="40" y="158">• Folders · first-index screen</text>
<text font-size="11.5" fill="#6b6862" x="52" y="176">what works now · pause</text>
<text font-size="11.5" fill="#1d1c1a" x="40" y="204">• Idle-time work (on power)</text>
<text font-size="11.5" fill="#6b6862" x="52" y="222">hourly: changed files</text>
<text font-size="11.5" fill="#6b6862" x="52" y="240">every 6 h: the deep run</text>
<text font-size="11.5" fill="#6b6862" x="52" y="258">5 min idle: larger model</text>
<text font-size="11.5" fill="#1d1c1a" x="40" y="286">• Open file · show in folder</text>
<text font-size="11.5" fill="#1d1c1a" x="40" y="314">• Settings · data folder</text>
<text font-size="11.5" fill="#6b6862" x="40" y="372">Low priority, half the cores</text>
<rect fill="#e7eef6" stroke="#2f5d8a" stroke-width="1.4" x="340" y="30" width="230" height="160" rx="12"/>
