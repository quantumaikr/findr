<text font-size="11.5" fill="#6b6862" x="360" y="78">reads files, writes the index</text>
<text font-size="11.5" fill="#1d1c1a" x="360" y="108">names → name meaning</text>
<text font-size="11.5" fill="#1d1c1a" x="360" y="128">→ text → meaning → scans</text>
<text font-size="11.5" fill="#6b6862" x="360" y="156">format readers · OCR</text>
<text font-size="11.5" fill="#6b6862" x="360" y="174">progress: progress.json</text>
