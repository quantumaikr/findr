<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="432" font-family="-apple-system, Segoe UI, Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif" viewBox="0 0 1120 432" role="img" aria-label="The app runs the indexer and the engine; the indexer writes index.db; the engine reads it and answers the search page"><rect x="0" y="0" width="100%" height="100%" rx="12" fill="#f7f6f2"/>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d1c1a"/></marker>
