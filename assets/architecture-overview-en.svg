<text font-size="11.5" fill="#1d1c1a" x="360" y="316">files: path · name · dates</text>
<text font-size="11.5" fill="#1d1c1a" x="360" y="336">chunks: text + vectors</text>
<text font-size="11.5" fill="#1d1c1a" x="360" y="356">fts: trigram word index</text>
<text font-size="11.5" fill="#1d1c1a" x="360" y="376">meta · photo vectors</text>
