<text font-size="11.5" fill="#6b6862" x="672" y="290">NVIDIA 10 GB+</text>
<text font-size="11.5" fill="#6b6862" x="660" y="324">helper servers</text>
<text font-size="11.5" fill="#6b6862" x="660" y="342">only what the PC can run</text>
