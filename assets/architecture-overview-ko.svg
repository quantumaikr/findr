<text font-size="11.5" fill="#1d1c1a" x="976" y="168">멈추기</text>
<!-- learned -->
<rect fill="#ffffff" stroke="#d9d5cc" stroke-width="1.2" x="960" y="240" width="140" height="160" rx="12"/>
