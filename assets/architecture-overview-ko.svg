<text font-size="11.5" fill="#6b6862" x="976" y="78">앱 창 · 브라우저</text>
<text font-size="11.5" fill="#1d1c1a" x="976" y="108">결과 · 확률</text>
<text font-size="11.5" fill="#1d1c1a" x="976" y="128">맞음 / 아님</text>
