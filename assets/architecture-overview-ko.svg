<line stroke="#2f5d8a" stroke-width="1.6" fill="none" x1="455" y1="190" x2="455" y2="238" marker-end="url(#arA)"/><text font-size="11" fill="#2f5d8a" font-weight="600" x="463" y="219">쓰기</text>
<line stroke="#2f5d8a" stroke-width="1.6" fill="none" x1="570" y1="320" x2="638" y2="320" marker-end="url(#arA)"/><text font-size="11" fill="#2f5d8a" font-weight="600" x="576" y="312">읽기</text>
<line stroke="#1d1c1a" stroke-width="1.3" fill="none" x1="570" y1="150" x2="638" y2="150" marker-end="url(#ar)"/><text font-size="11" fill="#6b6862" x="574" y="142">진행 상태</text>
