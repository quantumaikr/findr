<text font-size="11.5" fill="#1d1c1a" x="360" y="316">files: 파일 · 이름 · 날짜</text>
<text font-size="11.5" fill="#1d1c1a" x="360" y="336">chunks: 조각 글 + 뜻 벡터</text>
<text font-size="11.5" fill="#1d1c1a" x="360" y="356">fts: 3글자 단어 색인</text>
<text font-size="11.5" fill="#1d1c1a" x="360" y="376">meta · 사진 벡터</text>
