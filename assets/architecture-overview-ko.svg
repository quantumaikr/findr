<text font-size="11.5" fill="#6b6862" x="672" y="186">기억 단서·날짜 읽기</text>
<rect fill="#ffffff" stroke="#d9d5cc" stroke-width="1.2" x="660" y="202" width="230" height="44" rx="8"/>
<text font-size="11.5" fill="#1d1c1a" x="672" y="222">나란히 비교 모델</text>
