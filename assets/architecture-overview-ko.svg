<text font-size="11.5" fill="#6b6862" x="360" y="174">진행: progress.json</text>
<!-- store -->
<rect fill="#ffffff" stroke="#d9d5cc" stroke-width="1.2" x="340" y="240" width="230" height="160" rx="12"/>
