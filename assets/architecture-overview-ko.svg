<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="432" font-family="-apple-system, Segoe UI, Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif" viewBox="0 0 1120 432" role="img" aria-label="앱이 색인기와 검색 엔진을 실행하고, 색인기는 index.db에 쓰고, 검색 엔진은 읽어 검색 화면에 답하는 구성"><rect x="0" y="0" width="100%" height="100%" rx="12" fill="#f7f6f2"/>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d1c1a"/></marker>
<marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5d8a"/></marker>
</defs>
<!-- app -->
<rect fill="#ffffff" stroke="#d9d5cc" stroke-width="1.2" x="20" y="30" width="250" height="370" rx="12"/>
<text font-size="13.5" font-weight="650" fill="#1d1c1a" x="40" y="58">데스크톱 앱 (Tauri)</text>
<text font-size="11.5" fill="#6b6862" x="40" y="78">Windows · macOS · Linux</text>
<text font-size="11.5" fill="#1d1c1a" x="40" y="112">• 첫 실행: 이 PC에 맞는 준비</text>
<text font-size="11.5" fill="#6b6862" x="52" y="130">GPU 확인 → 연산 라이브러리 → 모델</text>
<text font-size="11.5" fill="#1d1c1a" x="40" y="158">• 폴더 고르기 · 첫 색인 화면</text>
<text font-size="11.5" fill="#6b6862" x="52" y="176">지금 할 수 있는 것 · 멈추기</text>
<text font-size="11.5" fill="#1d1c1a" x="40" y="204">• 쉬는 시간 작업 (전원 연결 시)</text>
<text font-size="11.5" fill="#6b6862" x="52" y="222">매시간: 바뀐 파일</text>
<text font-size="11.5" fill="#6b6862" x="52" y="240">6시간마다: 깊은 계산</text>
<text font-size="11.5" fill="#6b6862" x="52" y="258">입력 없음 5분: 큰 모델로 전환</text>
<text font-size="11.5" fill="#1d1c1a" x="40" y="286">• 파일 열기 · 폴더 보기</text>
<text font-size="11.5" fill="#1d1c1a" x="40" y="314">• 설정 · 데이터 폴더</text>
<text font-size="11.5" fill="#6b6862" x="40" y="372">낮은 우선순위, 코어 절반만</text>
<!-- indexer -->
<rect fill="#e7eef6" stroke="#2f5d8a" stroke-width="1.4" x="340" y="30" width="230" height="160" rx="12"/>
