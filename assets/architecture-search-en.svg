<text font-size="11.5" fill="#1d1c1a" x="34" y="82">"the final quote</text>
<text font-size="11.5" fill="#1d1c1a" x="34" y="100">I edited last year"</text>
<rect fill="#e7eef6" stroke="#2f5d8a" stroke-width="1.4" x="200" y="30" width="230" height="110" rx="10"/>
