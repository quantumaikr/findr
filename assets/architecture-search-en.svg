<defs><marker id="ar3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d1c1a"/></marker></defs>
<rect fill="#ffffff" stroke="#d9d5cc" stroke-width="1.2" x="20" y="30" width="150" height="110" rx="10"/>
