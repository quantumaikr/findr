# Before an app release: the same checks on Windows, macOS and Linux (CPU), so OS-specific breakage is caught before people
# meet it. They run on a release pull request (branch release-*) and by hand; other pull requests run the tests locally.
# Folder rules, file formats, and the whole path: setup check -> search before meaning vectors -> index -> search -> search page.
name: tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'release-')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      FINDR_E2E: "1"
      PYTHONUTF8: "1"
      FINDR_MODELS: ${{ github.workspace }}/.models
    steps:
      - uses: actions/checkout@v4

      - name: uv (Astral's server first, GitHub second)
        shell: bash
        run: |
          case "$RUNNER_OS" in Linux) T=x86_64-unknown-linux-gnu ;; macOS) T=aarch64-apple-darwin ;; Windows) T=x86_64-pc-windows-msvc ;; esac
          bash .github/get-uv.sh "$T" "$RUNNER_TEMP/uvbin"
          echo "$RUNNER_TEMP/uvbin" >> "$GITHUB_PATH"

      - name: Python environment
        shell: bash
        run: |
          uv venv --python 3.12 .venv
          if [ "$RUNNER_OS" = "macOS" ]; then
            uv pip install --python .venv torch torchvision
          else
            uv pip install --python .venv torch torchvision --index-url https://download.pytorch.org/whl/cpu
          fi
          uv pip install --python .venv -e . pytest

      - name: Windows Korean text recognition (as on Korean Windows; findr then uses Windows' own OCR)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-WindowsCapability -Online -Name "Language.OCR~~~ko-KR~0.0.1.0" | Out-Null
          Get-WindowsCapability -Online -Name "Language.OCR~~~ko-KR*" | Select-Object Name, State

      - name: Model cache
        uses: actions/cache@v4
        with:
          path: .models
          key: findr-models-${{ runner.os }}-v1

      - name: Tests
        shell: bash
        run: |
          PY=.venv/bin/python; [ -f .venv/Scripts/python.exe ] && PY=.venv/Scripts/python.exe
          "$PY" -m pytest -q -rs -s tests
