# Desktop installers for Windows, macOS and Linux.
# Push a tag like app-v0.2.0 (or run it by hand) and the installers are attached to a draft release.
name: desktop

on:
  push:
    tags: ["app-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
          - os: macos-latest
            triple: aarch64-apple-darwin
          - os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Bundle uv (the Python manager the app uses on first run)
        shell: bash
        run: |
          mkdir -p app/src-tauri/binaries && cd app/src-tauri/binaries
          if [ "${{ runner.os }}" = "Windows" ]; then
            curl -LsSf -o uv.zip https://github.com/astral-sh/uv/releases/latest/download/uv-${{ matrix.triple }}.zip
            unzip -o -q uv.zip && mv uv.exe uv-${{ matrix.triple }}.exe && rm -f uv.zip uvx.exe uvw.exe
          else
            curl -LsSf https://github.com/astral-sh/uv/releases/latest/download/uv-${{ matrix.triple }}.tar.gz | tar xz
            mv uv-${{ matrix.triple }}/uv uv-${{ matrix.triple }} && rm -rf uv-${{ matrix.triple }}/
          fi
          ls -la

      - name: Install app dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'app-v__VERSION__' }}
          releaseName: "findr __VERSION__"
          releaseBody: |
            findr 데스크톱 앱 설치 파일입니다.
            - Windows: .msi 또는 -setup.exe
            - macOS (Apple 칩): .dmg
            - Linux: .AppImage 또는 .deb
            처음 실행할 때 이 PC에 맞는 구성 요소와 모델을 받습니다(5~20분).
          releaseDraft: true
          prerelease: true
