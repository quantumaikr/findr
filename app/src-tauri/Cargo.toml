[package]
name = "findr-desktop"
version = "0.2.1"
description = "findr - 기억나는 대로 물으면, 내 PC가 찾아 줍니다"
edition = "2021"

[lib]
name = "findr_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
