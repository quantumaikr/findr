[package]
name = "findr-desktop"
version = "0.2.21"
description = "findr - 기억나는 대로 물으면, 내 PC가 찾아 줍니다"
edition = "2021"

[lib]
name = "findr_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Windows: the window's page process failing (WebView2 ProcessFailed) is seen and the page drawn again, and the thread that
# opens a found file has COM. The versions wry and the opener already use, so nothing new is built
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_System_Com"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
