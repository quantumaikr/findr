<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>

*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg);font:14.5px/1.55 -apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}

 // one look at a time: opening or closing the panel during a look started a second chain of looks that never ended
 let looking=false;
 async function tick(){if(looking)return;looking=true;clearTimeout(timer);
  try{const q=await (await fetch('/progress')).json();
   const fresh=q.stage&&q.stage!=='done'&&Date.now()/1000-q.t<900;
   if(fresh){P=q;active=true;wasActive=true}else{if(active){doneAt=Date.now();P.stages=Object.fromEntries(ST.map(s=>[s[0],(P.stages||{})[s[0]]==='later'?'later':'done']))}active=false;
    P.app=q.app;P.last_refresh=q.last_refresh;P.refresh_asked=q.refresh_asked}
   chip.hidden=!active&&!P.app&&!(wasActive&&Date.now()-doneAt<10000)&&pan.hidden; render()}catch(e){}
  looking=false; timer=setTimeout(tick,pan.hidden?5000:1500)}
 function open_(){pan.hidden=false;render();tick();pan.querySelector('.ixx')?.focus()}
 function close_(){pan.hidden=true;chip.focus();tick()}
 chip.onclick=()=>pan.hidden?open_():close_();
 pan.addEventListener('click',async e=>{if(e.target.closest('.ixx'))return close_();
  if(e.target.closest('.ixnow')){e.target.disabled=true;
   await fetch('/refresh',{method:'POST',headers:{'X-Findr':'1'}}).catch(()=>{});
   P.refresh_asked=true;render();setTimeout(tick,1500);return}
  if(e.target.closest('.ixpause')){e.target.disabled=true;
   await fetch('/pause',{method:'POST',headers:{'X-Findr':'1','Content-Type':'application/json'},body:JSON.stringify({on:!P.paused})}).catch(()=>{});
   P.paused=!P.paused;P.pausing=P.paused;render();setTimeout(tick,800)}});
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!pan.hidden)close_()});
 document.addEventListener('click',e=>{if(!pan.hidden&&!pan.contains(e.target)&&!chip.contains(e.target))close_()});
 const _show=show; show=function(r,f){_show(r,f);   // while files are still being read, say why some were found by name only
  if(!active||!r||!r.results)return;const sg=P.stages||{};
  const msg=sg.content!=='done'?T('아직 파일을 살펴보는 중이라, 일부는 이름으로만 찾았어요.','Still scanning your files, so some results were found by name only.'):sg.meaning!=='done'?T('아직 내용의 뜻을 파악하는 중이라, 비슷한 말로 찾기는 일부 파일만 돼요.','Still learning what your files mean, so similar-word search covers only some of them.'):'';
  if(msg)document.getElementById('notice')?.insertAdjacentHTML('afterbegin',`<div class="ixnote">${msg} <button class="ixmore">${T('진행 보기','See progress')}</button></div>`)};
 document.addEventListener('click',e=>{if(e.target.closest('.ixmore'))open_()});
 tick()})();
function show(r,fresh=true){   // fresh=false: the reranked order replacing the quick list (no fade, no empty moment)
 $('#res').classList.remove('dim');
 $('#under').innerHTML=understanding(r); $('#pipe').innerHTML=pipeline(r);
 $('#notice').innerHTML=(r.note?'<div class="notice">'+esc(r.note)+'</div>':'')+(r.info?'<div class="refine">ⓘ '+esc(r.info)+'</div>':'');
 facets(r.results||[]); list(fresh);
}
function filtered(){return (last&&last.results||[]).filter(x=>(!fKind||kindOf(x.path)[2]===fKind)&&(!fDir||dir(x.path)===fDir||dir(x.path).startsWith(fDir+'/')))}   // '보고서' is not '보고서2024'
// fresh: a new answer fades in. Every later redraw (the second look, 열기 turning on, filters, ✘) draws the cards as they
// are: a redraw that replayed the fade emptied the whole list for a moment, a few seconds after the results (field, Mac)
function list(fresh){
 const rs=filtered(), r=last;
 const routeTxt={auto:T('자동','Auto'),ng:T('이해 우선','Smart'),xce:T('정밀','Precise'),base:T('빠른 찾기','Fast')}[r.route||mode]||'';
 $('#meta').innerHTML='<span>'+T(rs.length+'개',rs.length+(rs.length===1?' result':' results'))+(fKind||fDir?T(' (거름)',' (filtered)'):'')+' · '+routeTxt+' <span id="rf" class="rf">'+esc(r.rfText||'')+'</span></span><span>'+T('서버 ','engine ')+r.ms+'ms · '+T('화면 ','page ')+r._rt+'ms</span>';
 $('#res').innerHTML=rs.map((x,i)=>{const k=kindOf(x.path);const d=dir(x.path);
  return '<div class="card'+(x.no?' rej':'')+(fresh?'':' still')+'" data-i="'+i+'" style="animation-delay:'+Math.min(i,8)*30+'ms"><div class="badge" style="background:'+k[1]+'">'+k[0]+'</div>'+
  '<div><div class="nm"><span class="rank">'+(i+1)+'</span>'+(x.prob!=null?'<span class="odds" style="background:'+(x.prob>=.7?'var(--acc)':x.prob>=.3?'#c27a2c':'#8a8780')+'">'+Math.round(x.prob*100)+'%</span>':'')+hl(base(x.path))+'</div><div class="path">'+
  d.split('/').map((seg,j,a)=>'<span data-dir="'+esc(a.slice(0,j+1).join('/'))+'">'+esc(seg)+'</span>').join(' / ')+'</div>'+
  (x.why&&x.why.length?'<div class="why">'+x.why.map(esc).join(' · ')+'</div>':'')+(x.snippet?'<div class="snip">'+hl(x.snippet)+'</div>':'')+(x.versions&&x.versions.length?'<div class="vers">'+T('다른 판 '+x.versions.length+'개: ',x.versions.length+(x.versions.length===1?' other version: ':' other versions: '))+x.versions.map((v,j)=>'<span data-vopen="'+i+':'+j+'" title="'+esc(v.path)+'">'+esc(base(v.path))+' · '+ago(v.date)+'</span>').join('')+'</div>':'')+(x.copies&&x.copies.length?'<div class="vers">'+T('같은 파일이 '+x.copies.length+'곳에 더 있음','also saved in '+x.copies.length+(x.copies.length===1?' more place':' more places'))+'</div>':'')+'</div>'+
  '<div class="side"><span title="'+esc(x.date)+'">'+ago(x.date)+'</span><span>'+fmt(x.size)+'</span><div class="act">'+(APP||LOCAL?'<button data-open="'+i+'">'+T('열기','Open')+'</button><button data-reveal="'+i+'">'+T('폴더','Folder')+'</button>':'')+'<button data-copy="'+i+'">'+T('경로 복사','Copy path')+'</button><button data-ok="'+i+'">'+T('✔ 맞음','✔ Right')+'</button><button data-no="'+i+'">'+T('✘ 아님','✘ Not this')+'</button></div></div></div>'}).join('')+
  (rs.length?'<div style="text-align:center;margin-top:10px"><button class="act" id="none" style="border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 12px;color:var(--mut)">'+T('✘ 찾는 파일이 여기 없음',"✘ My file isn't here")+'</button></div>':'');
}
function facets(rs){
 const kc={},dc={};
 rs.forEach(x=>{const k=kindOf(x.path)[2];kc[k]=(kc[k]||0)+1;const d=dir(x.path);dc[d]=(dc[d]||0)+1});
 $('#kinds').innerHTML=Object.entries(kc).sort((a,b)=>b[1]-a[1]).map(([k,n])=>'<div class="facet" data-kind="'+esc(k)+'"><span>'+esc(kindName(k))+'</span><span class="n">'+n+'</span></div>').join('');
 $('#folders').innerHTML=Object.entries(dc).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([d,n])=>'<div class="facet" data-fdir="'+esc(d)+'" title="'+esc(d)+'"><span class="fn">'+esc(d.split('/').filter(Boolean).slice(-2).join('/'))+'</span><span class="n">'+n+'</span></div>').join('');
}
document.addEventListener('click',e=>{
 const fk=e.target.closest('[data-kind]');if(fk){fKind=fKind===fk.dataset.kind?null:fk.dataset.kind;document.querySelectorAll('[data-kind]').forEach(x=>x.classList.toggle('on',x.dataset.kind===fKind));list();return}
 const fd=e.target.closest('[data-fdir]');if(fd){fDir=fDir===fd.dataset.fdir?null:fd.dataset.fdir;document.querySelectorAll('[data-fdir]').forEach(x=>x.classList.toggle('on',x.dataset.fdir===fDir));list();return}
 const sd=e.target.closest('[data-dir]');if(sd){fDir=sd.dataset.dir;list();toast(T('폴더로 거름: ','Filtered to folder: ')+fDir.split('/').slice(-2).join('/'));return}
 const vo=e.target.closest('[data-vopen]');if(vo&&(APP||LOCAL)){const [ci,vi]=vo.dataset.vopen.split(':').map(Number),vx=filtered()[ci],vp=vx.versions[vi].path,
   vfb=()=>fb('open',vp,last.results.indexOf(vx)+1,vx.prob,1);   // opened from 'other versions': that version's path, ver=1
  if(APP){once('o'+vp,()=>window.__TAURI__.core.invoke('open_path',{path:vp,reveal:false}).then(vfb).catch(err=>toast(String(err))));return}
  once('o'+vp,()=>fetch('/open',{method:'POST',headers:{'X-Findr':'1','Content-Type':'application/json'},body:JSON.stringify({path:vp,reveal:false})}).then(r=>{if(r.ok)vfb();toast(r.ok?T('파일을 열었습니다','File opened'):T('열지 못했습니다',"Couldn't open it"))}).catch(err=>toast(String(err))));return}
 const op=e.target.closest('[data-open],[data-reveal]');if(op&&(APP||LOCAL)){const x=filtered()[+(op.dataset.open!=null?op.dataset.open:op.dataset.reveal)],rv=op.dataset.reveal!=null,
   ofb=()=>fb(rv?'reveal':'open',x.path,last.results.indexOf(x)+1,x.prob);   // what was really opened is what findr learns from
  const ok_=(rv?'r':'o')+x.path;
  if(APP){once(ok_,()=>window.__TAURI__.core.invoke('open_path',{path:x.path,reveal:rv}).then(ofb).catch(err=>toast(String(err))));return}
  once(ok_,()=>fetch('/open',{method:'POST',headers:{'X-Findr':'1','Content-Type':'application/json'},body:JSON.stringify({path:x.path,reveal:rv})})
   .then(r=>r.ok?(ofb(),toast(rv?T('폴더를 열었습니다','Folder opened'):T('파일을 열었습니다','File opened'))):r.json().then(j=>toast(T('열지 못했습니다',"Couldn't open it")+(j.why=='not indexed'?T(': 색인에 없는 파일',': not in the index'):j.why=='FileNotFoundError'?T(': 파일이 옮겨졌거나 지워졌습니다',': the file was moved or deleted'):''))))
   .catch(err=>toast(String(err))));return}
 const cp=e.target.closest('[data-copy]');if(cp){const x=filtered()[+cp.dataset.copy];copy(x.path);fb('copy',x.path,last.results.indexOf(x)+1,x.prob);return}
 const no=e.target.closest('[data-no]');if(no){const x=filtered()[+no.dataset.no];x.no=true;fb('reject',x.path,last.results.indexOf(x)+1,x.prob);list();toast(T('기록: 이 파일은 아님','Noted: not this file'));return}
 const ok=e.target.closest('[data-ok]');if(ok){const x=filtered()[+ok.dataset.ok];fb('hit',x.path,last.results.indexOf(x)+1,x.prob);last.picked=1;ok.classList.add('done');ok.textContent=T('✔ 기록됨','✔ Saved');
  const h=hist(),hi=h.find(y=>y.q===last.q0);if(hi){hi.hit=1;store.set('findr.hist',h);renderHist()}return}
 if(e.target.id==='none'){fb('none');toast(T('기록: 여기 없음','Noted: not in this list'));return}
});
function copy(p){try{navigator.clipboard.writeText(p).then(()=>toast(T('경로를 복사했습니다','Path copied')),()=>toast(p))}catch(e){toast(p)}}
// the question that made this list (not what is being typed now), and the route that answered it
function fb(v,p,k,pr,ver){const L=last||{},quiet=v==='open'||v==='reveal'||v==='copy';   // those three keep their own toast
 fetch('/fb?'+new URLSearchParams({q:L.q0||q.value,mode:L.route||mode,path:p||'',rank:k||'',verdict:v,prob:pr==null?'':pr,
 first_rank:(L.first&&p)?(L.first.indexOf(p)+1):'',secs:L.t0?Math.round((Date.now()-L.t0)/1000):'',page:'',
 shown:(L.results||[]).slice(0,30).map(x=>x.path).join(String.fromCharCode(10)),tried:tried.join(String.fromCharCode(10)),...(ver?{ver:'1'}:{})})).then(r=>{if(quiet)return;if(!r.ok){toast(T('기록하지 못했습니다',"Couldn't save that"));return}if(v==='hit'){toast(T(k+'위가 정답으로 기록됐습니다','Saved #'+k+' as the right file'));tried=[]}}).catch(()=>{if(!quiet)toast(T('기록하지 못했습니다',"Couldn't save that"))})}
// keyboard
document.addEventListener('keydown',e=>{
 if(e.key==='/'&&document.activeElement!==q){e.preventDefault();q.focus();q.select();return}
 if(e.key==='Enter'&&document.activeElement===q){if(e.repeat)return;if(e.isComposing||e.keyCode===229)return;go();return}   // Hangul: the Enter that ends a syllable is not a second search
 if(e.key==='Escape'){q.value='';q.focus();return}
 const cards=[...document.querySelectorAll('.card')];if(!cards.length)return;
 if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();sel=Math.max(0,Math.min(cards.length-1,sel+(e.key==='ArrowDown'?1:-1)));
  cards.forEach((c,i)=>c.classList.toggle('sel',i===sel));cards[sel].scrollIntoView({block:'nearest'})}
 if(e.key==='Enter'&&sel>=0&&document.activeElement!==q){const x=filtered()[sel];copy(x.path);fb('copy',x.path,last.results.indexOf(x)+1,x.prob)}
});
// placeholder rotation, status
let pi=0;q.placeholder=PH[0];setInterval(()=>{if(!q.value){pi=(pi+1)%PH.length;q.placeholder=PH[pi]}},3500);
fetch('/stats').then(r=>r.json()).then(s=>{$('#st1').innerHTML=T('색인 <b>'+s.files.toLocaleString()+'</b>개 파일','<b>'+s.files.toLocaleString()+'</b> files indexed');
 $('#st2').innerHTML=T('인터넷 연결 없이 동작','Works offline')}).catch(()=>{});
// demo mode (?demo=1): captions, title cards, typed questions, speed badge; Drive results are left out of the picture
const DEMO=/[?&]demo=1/.test(location.search);
const sleep=t=>new Promise(r=>setTimeout(r,t));
function speed(r){const e=$('#spd');e.classList.remove('on');void e.offsetWidth;e.textContent='⚡ '+(r.ms/1000).toFixed(2)+T('초','s');setTimeout(()=>e.classList.add('on'),30)}
window.demo={
 async type(s,ms){q.value='';q.focus();for(const ch of s){q.value+=ch;await sleep(ms||24)}await sleep(160);await go()},
 cap(t,sub){const e=$('#cap');if(!t){e.classList.remove('on');return}e.innerHTML=esc(t)+(sub?'<small>'+esc(sub)+'</small>':'');e.classList.add('on')},
 title(h,p,big){const e=$('#tcard');if(!h){e.classList.remove('on');return}e.innerHTML='<h1>'+esc(h)+'</h1><p>'+esc(p||'')+'</p>'+(big?'<div class="big">'+big.map(x=>'<div><b>'+esc(x[0])+'</b>'+esc(x[1])+'</div>').join('')+'</div>':'');e.classList.add('on')},
 mode:setMode, kind(k){const f=document.querySelector('[data-kind="'+k+'"]');if(f)f.click()},
 down(){document.dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowDown'}))},
 histClick(i){const l=document.querySelectorAll('#hist li[data-q]')[i||0];if(l)l.click()}
};
if(DEMO){try{localStorage.clear();if(LANG_SAVED)localStorage.setItem('findr.lang',LANG)}catch(e){}}
setMode(DEMO?'auto':store.get('findr.mode','auto'));renderHist();q.focus();
try{const q0=new URLSearchParams(location.search).get('q');if(q0){q.value=q0.slice(0,300);go()}}catch(_){}
</script></body></html>
